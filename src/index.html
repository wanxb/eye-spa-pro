<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eye Spa Pro | 职场眼神守护计划</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="glow"></div>
    <div id="app">
        <header id="header">
            <div class="logo">👁️</div>
            <h1>Eye Spa <span class="accent">Pro</span></h1>
            <p class="subtitle">针对长期屏前办公的视觉动力学修复方案</p>
            <div class="stats">
                <span>建议频率：每 45min / 一次</span>
                <span>预计耗时：3 分钟</span>
            </div>
            <button class="primary-btn" onclick="initExercise()">进入沉浸练习</button>
            <p class="tip">建议按 F11 进入全屏体验更好</p>
        </header>

        <main id="stage">
            <div id="ball"></div>
        </main>

        <section id="info-panel">
            <div id="hint">准备好开始了吗？</div>
            <div class="progress-container">
                <div id="progress-bar"></div>
            </div>
        </section>

        <footer id="quote-box"></footer>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
